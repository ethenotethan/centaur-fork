[project]
name = "company_context"
description = "Search indexed company history, user-visible Slack DMs, Google Docs, and Granola notes. Prefer this over direct Slack, Drive, or Granola search for historical queries. Current sources: Slack, Slack DMs, Google Docs, Google Calendar, Linear, Granola."
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
company_context = "company_context.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "company_context"

[tool.centaur]
module = "client.py"

# Upstream secret shape, with the two DARKBLOOM overrides preserved from the
# fork: our deployment's database is ai_v2 (not `centaur`) and the DSN lives
# in DATABASE_URL (not CENTAUR_POSTGRES_DSN).
[[tool.centaur.secrets]]
type = "pg_dsn"
name = "company_context_dsn"
database = "ai_v2"
secret_ref = "DATABASE_URL"
role = "centaur_slack_reader"
settings = [
    { name = "centaur.slack_channel_id", value_from = { principal_label = "slack_channel_id" } },
    { name = "centaur.slack_team_id", value_from = { principal_label = "slack_team_id" } },
    { name = "centaur.slack_user_id", value_from = { principal_label = "slack_user_id" } },
]
