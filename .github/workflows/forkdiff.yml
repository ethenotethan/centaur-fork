name: Forkdiff

on:
  push:
    branches: [migrate/rust-stack]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forkdiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: migrate/rust-stack

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/paradigmxyz/centaur.git
          git fetch upstream main --depth=1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install forkdiff
        run: go install github.com/protolambda/forkdiff@latest

      - name: Generate forkdiff
        run: |
          $(go env GOPATH)/bin/forkdiff \
            -repo . \
            -upstream-repo . \
            -fork fork.yaml \
            -out index.html

      - name: Publish to op-geth branch
        run: |
          cd /tmp
          mkdir -p site
          cp "$GITHUB_WORKSPACE/index.html" site/
          cd site
          git init
          git checkout -b op-geth
          git add index.html
          git -c user.name="forkdiff-bot" -c user.email="forkdiff-bot@users.noreply.github.com" \
            commit -m "forkdiff: update $(date -u +%Y-%m-%d)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin op-geth --force
